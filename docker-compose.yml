# The draw service has no published port: only the web app reaches it.
services:
  api:
    build: .
    restart: unless-stopped
    environment:
      PUBLICDRAW_ORGANISER_TOKEN: ${PUBLICDRAW_ORGANISER_TOKEN:?set this in .env}
    volumes:
      - data:/data

  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api]
    environment:
      NUXT_API_INTERNAL: http://api:8080/v1
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:?set this in .env}
    ports:
      - 127.0.0.1:3001:3000

volumes:
  data:
